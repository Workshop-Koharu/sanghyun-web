<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#181a27"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#818cf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>

  <!-- Outer Shield Outline -->
  <path d="M16 18 L32 10 L48 18 V34 C48 45 32 54 32 54 C32 54 16 45 16 34 Z" 
        stroke="url(#crestGrad)" stroke-width="2.5" stroke-linejoin="round" fill="#1e1b4b" fill-opacity="0.3" filter="url(#glow)"/>

  <!-- Crescent Moon at Top (상현달) -->
  <path d="M30 14 C32 14 34.5 15.5 35 17.5 C33.5 17 31.5 17.2 30.5 18.5 C29.5 19.8 29.8 21.5 30.5 22.5 C28.5 22 27 20 27 18 C27 15.8 28.3 14 30 14 Z" 
        fill="#38bdf8"/>

  <!-- Left Wing -->
  <path d="M20 22 C23 23 26 27 27 31 C24 30 21 28 20 26 Z" fill="url(#crestGrad)"/>
  <path d="M18 27 C22 28 25 33 26 37 C23 35 19 33 18 30 Z" fill="url(#crestGrad)" opacity="0.8"/>

  <!-- Right Wing -->
  <path d="M44 22 C41 23 38 27 37 31 C40 30 43 28 44 26 Z" fill="url(#crestGrad)"/>
  <path d="M46 27 C42 28 39 33 38 37 C41 35 45 33 46 30 Z" fill="url(#crestGrad)" opacity="0.8"/>

  <!-- Center 'ㅅ' (Sang) Symbol -->
  <path d="M32 25 L25 38 M32 25 L39 38" 
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center 'ㅎ' (Hyun) Ring & Hat -->
  <line x1="28" y1="42" x2="36" y2="42" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="47" r="3.5" stroke="#ffffff" stroke-width="2" fill="none"/>
</svg>
